plugins {
    id 'java'
    id 'application'
    id 'info.solidsoft.pitest' version '1.19.0'
}

group = 'com.rulecity'
version = '1.0-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

application {
    mainClass = 'com.rulecity.Main'
}

repositories {
    mavenCentral()
}

sourceSets {
    integrationTest {
        java {
            srcDir 'src/test-integration/java'
        }
        resources {
            srcDir 'src/test-integration/resources'
        }
        compileClasspath += sourceSets.main.output + sourceSets.test.output
        runtimeClasspath += sourceSets.main.output + sourceSets.test.output
    }
}

configurations {
    integrationTestImplementation.extendsFrom testImplementation
    integrationTestRuntimeOnly.extendsFrom testRuntimeOnly
}

dependencies {

    implementation 'org.slf4j:slf4j-api:2.0.17'
    implementation 'ch.qos.logback:logback-classic:1.5.6'

    testImplementation platform('org.junit:junit-bom:5.10.0')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testImplementation 'org.mockito:mockito-core:5.23.0'
    testImplementation 'org.mockito:mockito-junit-jupiter:5.23.0'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testRuntimeOnly 'net.bytebuddy:byte-buddy:1.18.8'
    testRuntimeOnly 'net.bytebuddy:byte-buddy-agent:1.18.8'
}

test {
    useJUnitPlatform()
    // Unit tests must not touch the filesystem. Integration tests live in :integrationTest.
    include '**/*Test.class'
    exclude '**/*IT.class'
    testLogging {
        events 'passed', 'skipped', 'failed'
        exceptionFormat = 'full'
    }
}

tasks.register('integrationTest', Test) {
    description = 'Runs integration tests (filesystem-touching tests suffixed with IT).'
    group = 'verification'
    testClassesDirs = sourceSets.integrationTest.output.classesDirs
    classpath = sourceSets.integrationTest.runtimeClasspath
    useJUnitPlatform()
    shouldRunAfter test
    include '**/*IT.class'
    testLogging {
        events 'passed', 'skipped', 'failed'
        exceptionFormat = 'full'
    }
}

check.dependsOn integrationTest

pitest {
    // Pin PIT itself to a version that supports Java 25 bytecode.
    pitestVersion = '1.20.4'
    junit5PluginVersion = '1.2.3'

    targetClasses = ['com.rulecity.*']
    // Main is the wiring entry point — its branches are exercised by integration tests,
    // not unit tests, so excluding it keeps mutation analysis honest for the unit suite.
    excludedClasses = ['com.rulecity.Main']
    // Only the unit tests drive mutation analysis; integrationTest is excluded.
    testSourceSets = [sourceSets.test]
    mainSourceSets = [sourceSets.main]

    threads = 4
    timestampedReports = false
    outputFormats = ['HTML', 'XML']
    timeoutFactor = 2.0
    timeoutConstInMillis = 10000

    mutationThreshold = 100
}
