[sdl]
nosound=true

[midi]
mididevice=none

[cpu]
core=dynamic
cputype=pentium_slow
cycles=fixed 500000

[autoexec]
mount c /shared
set INCLUDE=C:\C600\INCLUDE
set LIB=C:\C600\LIB
set PATH=C:\C600\BIN;C:\C600\BINB;C:\MASM\BIN;C:\MASM\BINB
c:
cd source
if not exist BUILD.BAT goto nobuild
call BUILD.BAT
goto done
:nobuild
echo.
echo No BUILD.BAT found in the mounted workspace.
echo Put your sources and a BUILD.BAT into the directory you mounted at /workspace.
echo See docker/build.bat in the repo for a sample.
echo.
:done
exit
